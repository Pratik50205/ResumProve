<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rp-doc-bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="rp-accent-arrow" x1="12" y1="24" x2="26" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="rp-glow" x="8" y="4" width="22" height="24" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base rounded canvas container -->
  <rect width="32" height="32" rx="7" fill="url(#rp-doc-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="rgba(255,255,255,0.2)"/>

  <!-- Resume Document Page Silhouette with folded corner -->
  <path d="M7 6C7 4.89543 7.89543 4 9 4H19L25 10V26C25 27.1046 24.1046 28 23 28H9C7.89543 28 7 27.1046 7 26V6Z" fill="#0F172A" fill-opacity="0.55" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- Folded corner triangle -->
  <path d="M19 4V9C19 9.55228 19.4477 10 20 10H25" fill="#312E81" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Resume Header and Content lines -->
  <rect x="10" y="8" width="6" height="2" rx="0.75" fill="#A5B4FC"/>
  <rect x="10" y="12" width="10" height="1.5" rx="0.75" fill="#CBD5E1" fill-opacity="0.7"/>
  <rect x="10" y="15.5" width="8" height="1.5" rx="0.75" fill="#CBD5E1" fill-opacity="0.5"/>
  <rect x="10" y="19" width="6" height="1.5" rx="0.75" fill="#CBD5E1" fill-opacity="0.4"/>

  <!-- The "Improve & Prove" dynamic upward badge / arrow checkmark -->
  <g filter="url(#rp-glow)">
    <!-- Ascending growth bar chart pills -->
    <rect x="17" y="21" width="2" height="4" rx="1" fill="#34D399" fill-opacity="0.8"/>
    <rect x="20" y="18" width="2" height="7" rx="1" fill="#34D399"/>
    <!-- Bold Surge Checkmark / Arrow -->
    <path d="M12 21L15.5 24.5L25 14" stroke="url(#rp-accent-arrow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
